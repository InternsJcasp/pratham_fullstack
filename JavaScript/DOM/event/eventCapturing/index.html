<!-- 🎯 Practice: Checkout Page

Imagine an e-commerce checkout page:

Checkout Page
    ↓
Payment Section
    ↓
Pay Now Button

When the user clicks Pay Now, we will use Event Capturing so that the event travels:

Checkout Page
      ↓
Payment Section
      ↓
Pay Now Button -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Capturing Practice</title>
  </head>
  <body>
    <div id="checkout">
      <h1>Checkout</h1>

      <div id="paymentSection">
        <h2>Payment</h2>

        <button id="payButton">Pay Now</button>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
